[package]
name = "joplin-rs-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "joplin-rs-app"
path = "src/main.rs"

[dependencies]
joplin-rs-core = { workspace = true }
tokio = { workspace = true }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.32"
egui_commonmark = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
pbkdf2 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }

# Native macOS menu bar / About panel / rounded dock icon.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSDictionary", "NSArray", "NSObject"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSMenu", "NSMenuItem"] }

[dev-dependencies]
tempfile = { workspace = true }
