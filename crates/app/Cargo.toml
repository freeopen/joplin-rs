[package]
name = "joplin-rs-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "joplin-rs-app"
path = "src/main.rs"

[dependencies]
joplin-rs-core = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
pbkdf2 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
# East Asian display width for Visual Block columns (CJK = 2 cells).
unicode-width = "0.2"
# GPUI Kit: one dependency for gpui 0.3.9 (gpui-pre family), gpui-base and
# gpui-component (Input/Dialog/TextView), plus default assets. Its desktop
# platform dependency enables runtime_shaders, so a machine without Xcode's
# metal compiler builds out of the box. macOS deployment target 11.0
# (Big Sur) is verified to compile via runtime availability guards
# (see docs/gpui-kit-migration.md §7.7).
gpui-kit = "0.7.3"
# Decode assets/icon.png for the window icon (X11) and dock icon.
image = { version = "0.25", default-features = false, features = ["png"] }

# Native macOS menu bar / About panel / rounded dock icon.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSDictionary", "NSArray", "NSObject"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSMenu", "NSMenuItem"] }

[dev-dependencies]
tempfile = { workspace = true }
# Headless GPUI windows for view-level tests (`#[gpui::test]`). Depend on the
# engine directly: gpui-kit's own test-support feature pulls the optional
# gpui-fast stack, whose pinned unicode-properties version conflicts with the
# locked gpui-pre one.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
