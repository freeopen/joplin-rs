name: Release

# Official releases (non-prerelease):
# - push to master: the version X.Y.Z is derived automatically from git history
#   (release-style reset: take the strongest level among the feat/fix commits
#   after the last tag, apply it exactly once, and zero the lower fields -- feat
#   bumps minor and zeroes patch, fix bumps patch, `!` bumps major and zeroes
#   minor/patch); CI creates the tag vX.Y.Z on the current commit itself and
#   publishes the Release (a tag created with GITHUB_TOKEN does not trigger this
#   pipeline again, so there is no recursion risk); if a tag for that version
#   already exists (this push had no feat/fix commits, so the version did not
#   change), the release is skipped
# - push a manual tag vX.Y.Z: publish an official Release bound to that tag
# Release body: the release job builds it from `git log <previous tag>..HEAD`,
#   grouped by conventional-commit prefix (feat -> New features, fix -> Bug
#   fixes, perf -> Performance, everything else -> Other changes), see
#   release-body.md
# Artifacts: Linux/Windows tar.gz/zip bundle both binaries (CLI + GUI); the
#   macOS tar.gz carries only the CLI (joplin-rs), while the GUI
#   (joplin-rs-app) ships separately as a .dmg (joplin-rs.app bundle, drag into
#   Applications, see tools/make-dmg.sh)
on:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # a full history and tags are needed so build.rs can derive the
          # version with git describe/log
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Linux: build-time system libs required by gpui-pre-linux.
      # zed-font-kit uses yeslogic-fontconfig-sys by default (pkg-config
      # fontconfig); xkbcommon/x11 need libxkbcommon-x11.so at link time --
      # note that on Ubuntu 24.04 libxkbcommon-dev ships only
      # libxkbcommon.so, while the -x11 link symbols live in
      # libxkbcommon-x11-0 (a runtime package) with no .so symlink, so add one
      # by hand.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libfontconfig1-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libxcb1-dev
          sudo ln -sf libxkbcommon-x11.so.0 \
            /usr/lib/x86_64-linux-gnu/libxkbcommon-x11.so

      # Build from the workspace root so both bins are produced. On failure,
      # echo the tail of the cargo output (the actual error lines) into the log
      # so anyone can see why it failed.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if cargo build --release --target ${{ matrix.target }} 2>&1 | tee build.log; then
            echo "build ok"
          else
            echo "### build failed; last 120 lines ###"
            tail -n 120 build.log || true
            exit 1
          fi

      # Single source of truth for the version: read --version (X.Y.Z) from the
      # compiled binary
      - name: Resolve version
        shell: bash
        run: |
          set -e
          BIN="target/${{ matrix.target }}/release/joplin-rs"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          VERSION="$($BIN --version | sed -E 's/.* v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')" # strip the v prefix and hash to get plain X.Y.Z
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version $VERSION"

      # ---------- Packaging: CLI binaries (Linux/Windows both, macOS CLI only) ----------
      - name: Package CLI (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -e
          BIN_DIR="target/${{ matrix.target }}/release"
          OUT="joplin-rs-${VERSION}-${{ matrix.target }}.tar.gz"
          mkdir -p stage
          if [ "${{ runner.os }}" = "macOS" ]; then
            # macOS: the CLI archive carries only the joplin-rs binary; the GUI ships as a .dmg
            cp "$BIN_DIR/joplin-rs" LICENSE stage/
            tar czf "$OUT" -C stage joplin-rs LICENSE
          else
            cp "$BIN_DIR/joplin-rs" "$BIN_DIR/joplin-rs-app" LICENSE stage/
            tar czf "$OUT" -C stage joplin-rs joplin-rs-app LICENSE
          fi

      - name: Package CLI (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          set -e
          BIN_DIR="target/${{ matrix.target }}/release"
          OUT="joplin-rs-${VERSION}-${{ matrix.target }}.zip"
          mkdir -p stage
          cp "$BIN_DIR/joplin-rs.exe" "$BIN_DIR/joplin-rs-app.exe" LICENSE stage/
          (cd stage && 7z a "../$OUT" joplin-rs.exe joplin-rs-app.exe LICENSE)

      # ---------- macOS: package the GUI app as a .dmg (app-only bundle) ----------
      - name: Package macOS app DMG
        if: runner.os == 'macOS'
        shell: bash
        run: ./tools/make-dmg.sh --target ${{ matrix.target }}

      - name: List artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: ls -la "joplin-rs-${VERSION}-${{ matrix.target }}."*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: joplin-rs-${{ matrix.target }}
          path: joplin-rs-${{ env.VERSION }}-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # A full history plus all tags are needed to generate this version's
      # changelog with `git log <previous tag>..HEAD` (fetch-depth: 0 also
      # fetches tags).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve version and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p rel
          tar xzf artifacts/joplin-rs-*-x86_64-unknown-linux-gnu.tar.gz -C rel
          VERSION="$(./rel/joplin-rs --version | sed -E 's/.* v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')" # get plain X.Y.Z; the Release/tag still use plain vX.Y.Z with no hash
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # manual release tag: bind the Release to that tag
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            # daily push: the version is plain SemVer, so prefix it with v to form the tag
            TAG_NAME="v${VERSION}"
            # when the version did not change (no feat/fix commits in this push) the tag
            # already exists, so skip the release to avoid attaching new artifacts to
            # an old commit's tag
            if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
              echo "Tag ${TAG_NAME} already exists at an older commit; skipping release."
              echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "Releasing $VERSION as $TAG_NAME"

      # Generate this version's changelog from the git log (the source of the
      # Release body): group by conventional-commit prefix -- feat under
      # "New features", fix under "Bug fixes", perf under "Performance", and
      # everything else under "Other changes". The range is the previous
      # release tag..HEAD.
      - name: Generate release notes from git log
        if: env.SKIP_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${{ env.TAG_NAME }}"
          VERSION="${{ env.VERSION }}"
          PREV_TAG="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vx "$TAG_NAME" | head -n1 || true)"
          if [ -n "$PREV_TAG" ]; then RANGE="$PREV_TAG..HEAD"; else RANGE="HEAD"; fi
          echo "Generating release notes for $VERSION (range: $RANGE)"

          d="$(mktemp -d)"
          : > "$d/feat"; : > "$d/fix"; : > "$d/perf"; : > "$d/other"
          git log "$RANGE" --no-merges --pretty=format:'%s' | while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            case "$subject" in
              chore\(release*|Release\ v*|v[0-9]*.[0-9]*.[0-9]*) continue ;;
            esac
            case "$subject" in
              feat:*|feat\(*\):*|feat!:*|feat\(*\)!:*) section="feat" ;;
              fix:*|fix\(*\):*|fix!:*|fix\(*\)!:*)   section="fix" ;;
              perf:*|perf\(*\):*|perf!:*)             section="perf" ;;
              *)                                       section="other" ;;
            esac
            text="$(printf '%s' "$subject" | sed -E 's/^[a-z]+(\([^)]*\))?!?: //')"
            printf -- '- %s\n' "$text" >> "$d/$section"
          done

          {
            echo "## joplin-rs $VERSION"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "_Changes since \`$PREV_TAG\`_"
            else
              echo "_Initial release_"
            fi
            echo
            if [ -s "$d/feat" ]; then echo "### ✨ New features"; cat "$d/feat"; echo; fi
            if [ -s "$d/fix" ]; then echo "### 🐛 Bug fixes"; cat "$d/fix"; echo; fi
            if [ -s "$d/perf" ]; then echo "### ⚡ Performance"; cat "$d/perf"; echo; fi
            if [ -s "$d/other" ]; then echo "### 🔧 Other changes"; cat "$d/other"; echo; fi
            if [ -n "$PREV_TAG" ]; then
              echo "---"
              echo "Full changelog: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG_NAME}"
            fi
          } > release-body.md

          echo "----- release-body.md -----"
          cat release-body.md

      - name: Publish Release
        if: env.SKIP_RELEASE != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.VERSION }}
          body_path: release-body.md
          files: artifacts/*
          # The body comes from release-body.md generated in the previous step,
          # not from GitHub's automatic summary (which cannot see the direct
          # commits this repo pushes without PRs).
          generate_release_notes: false
          draft: false
          prerelease: false
